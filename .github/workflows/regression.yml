name: SIG regression checks
on:
  push:
    paths:
      - '*.py'
      - 'tests/**'
      - '.github/workflows/regression.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sigtest
          POSTGRES_PASSWORD: sigtest
          POSTGRES_DB: sigtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIG_TEST_DATABASE_URL: postgresql://sigtest:sigtest@localhost:5432/sigtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q -f .
      - name: Run regression suite and save log
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee regression-results.txt
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sig-regression-results
          path: regression-results.txt
          if-no-files-found: warn
